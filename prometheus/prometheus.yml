  - job_name: 'ubiquiti_airmax'
    file_sd_configs:
      - files:
        - '/etc/prometheus/targets/ubiquiti_airmax_targets.yml'
    metrics_path: /snmp
    params:
      module: [ubiquiti_airmax]
      auth: [public_v1]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116  # SNMP exporter address
    metric_relabel_configs:
      - source_labels: [sysName]
        target_label: device_name
        action: replace

